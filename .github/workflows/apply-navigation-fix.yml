name: Apply Navigation Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-navigation-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace nested navigation stacks and restore native keyboard avoidance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MisMeeter/DashboardView.swift')
          s = p.read_text()
          old = '''        ZStack(alignment: .bottom) {
            TabView(selection: $selectedTab) {
                NavigationStack { txHome }.tag(DashboardSection.transmit)
                NavigationStack { rxHome }.tag(DashboardSection.receive)
                NavigationStack { presets }.tag(DashboardSection.presets)
                NavigationStack { settings }.tag(DashboardSection.settings)
            }
            .tabViewStyle(.page(indexDisplayMode: .never))
            .ignoresSafeArea(.keyboard, edges: .bottom)

            if !isEditingPreset { navigationBar.padding(.bottom, 8) }
        }
'''
          new = '''        ZStack(alignment: .bottom) {
            NavigationStack {
                TabView(selection: $selectedTab) {
                    txHome.tag(DashboardSection.transmit)
                    rxHome.tag(DashboardSection.receive)
                    presets.tag(DashboardSection.presets)
                    settings.tag(DashboardSection.settings)
                }
                .tabViewStyle(.page(indexDisplayMode: .never))
            }

            if !isEditingPreset { navigationBar.padding(.bottom, 8) }
        }
'''
          if old not in s:
              raise SystemExit('Expected DashboardView navigation block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-navigation-fix.yml
          git add MisMeeter/DashboardView.swift
          git commit -m "Stabilize navigation and restore native keyboard avoidance"
          git push
