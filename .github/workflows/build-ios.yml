name: Build and Release iOS IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned Release app
        run: |
          set -o pipefail
          xcodebuild -project MisMeeter.xcodeproj -scheme MisMeeter -configuration Release -sdk iphoneos -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee xcodebuild.log
      - name: Package IPA
        run: |
          APP="$PWD/build/Build/Products/Release-iphoneos/MisMeeter.app"
          test -d "$APP"
          rm -rf package && mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package && /usr/bin/zip -qry "$GITHUB_WORKSPACE/MisMeeter-5.1.0-unsigned.ipa" Payload
      - name: Publish GitHub Release with direct IPA asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v5.1.0 >/dev/null 2>&1; then
            gh release upload v5.1.0 MisMeeter-5.1.0-unsigned.ipa --clobber
          else
            gh release create v5.1.0 MisMeeter-5.1.0-unsigned.ipa --target "$GITHUB_SHA" --title "MisMeeter 5.1.0" --notes "Known-good Core Audio/VBAN networking baseline with live preset switching. The release asset is the IPA itself, compiled by GitHub Actions."
          fi
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MisMeeter-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
