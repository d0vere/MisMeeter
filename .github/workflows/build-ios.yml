name: Build and Release iOS IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned Release app
        run: |
          set -o pipefail
          xcodebuild -project MisMeeter.xcodeproj -scheme MisMeeter -configuration Release -sdk iphoneos -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee xcodebuild.log
      - name: Package IPA
        run: |
          APP="$PWD/build/Build/Products/Release-iphoneos/MisMeeter.app"
          test -d "$APP"
          rm -rf package && mkdir -p package/Payload
          cp -R "$APP" package/Payload/
          cd package && /usr/bin/zip -qry "$GITHUB_WORKSPACE/MisMeeter-5.0.0-unsigned.ipa" Payload
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MisMeeter-5.0.0-unsigned
          path: MisMeeter-5.0.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MisMeeter-5.0.0-unsigned.ipa --title "MisMeeter 5.0.0" --notes "Complete low-latency VBAN core rewrite. IPA compiled entirely by GitHub Actions. Unsigned build for sideload signing workflows."
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MisMeeter-build-log
          path: xcodebuild.log
          if-no-files-found: ignore