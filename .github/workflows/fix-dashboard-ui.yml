name: Fix Dashboard UI
on: push
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix navigation and keyboard avoidance
        shell: python
        run: |
          from pathlib import Path
          p = Path("MisMeeter/DashboardView.swift")
          s = p.read_text()
          old = """        ZStack(alignment: .bottom) {
            TabView(selection: $selectedTab) {
                NavigationStack { txHome }.tag(DashboardSection.transmit)
                NavigationStack { rxHome }.tag(DashboardSection.receive)
                NavigationStack { presets }.tag(DashboardSection.presets)
                NavigationStack { settings }.tag(DashboardSection.settings)
            }
            .tabViewStyle(.page(indexDisplayMode: .never))
            .ignoresSafeArea(.keyboard, edges: .bottom)

            if !isEditingPreset { navigationBar.padding(.bottom, 8) }
        }
"""
          new = """        ZStack(alignment: .bottom) {
            NavigationStack {
                TabView(selection: $selectedTab) {
                    txHome.tag(DashboardSection.transmit)
                    rxHome.tag(DashboardSection.receive)
                    presets.tag(DashboardSection.presets)
                    settings.tag(DashboardSection.settings)
                }
                .tabViewStyle(.page(indexDisplayMode: .never))
            }

            if !isEditingPreset { navigationBar.padding(.bottom, 8) }
        }
"""
          if old not in s:
              raise SystemExit("Expected navigation block not found")
          p.write_text(s.replace(old, new, 1))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MisMeeter/DashboardView.swift
          git commit -m "Fix dashboard navigation and keyboard avoidance"
          git push
