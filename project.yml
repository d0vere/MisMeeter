name: MisMeeter

options:
  bundleIdPrefix: dev.mismeeter
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  MisMeeter:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: MisMeeter
    info:
      path: MisMeeter/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mismeeter.app
        PRODUCT_NAME: MisMeeter
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: MisMeeterWidget
        embed: true

  MisMeeterWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: MisMeeterWidget
    info:
      path: MisMeeterWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mismeeter.app.widget
        PRODUCT_NAME: MisMeeterWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
