name: MisMeeter

options:
  bundleIdPrefix: dev.mismeeter
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  MisMeeter:
    type: application
    platform: iOS

    sources:
      - path: Shared
      - path: MisMeeter

    info:
      path: MisMeeter/Generated-Info.plist
      properties:
        CFBundleDisplayName: MisMeeter
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.8"
        CFBundleVersion: "20"
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: "MisMeeter uses the iPhone microphone to transmit audio to VoiceMeeter over VBAN."
        NSLocalNetworkUsageDescription: "MisMeeter sends microphone audio to your VoiceMeeter PC over the local network."
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mismeeter.app
        PRODUCT_NAME: MisMeeter
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"

    dependencies:
      - target: MisMeeterWidget
        embed: true

  MisMeeterWidget:
    type: app-extension
    platform: iOS

    sources:
      - path: Shared
      - path: MisMeeterWidget

    info:
      path: MisMeeterWidget/Generated-Info.plist
      properties:
        CFBundleDisplayName: MisMeeter Live Activity
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "1.8"
        CFBundleVersion: "20"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mismeeter.app.widget
        PRODUCT_NAME: MisMeeterWidget
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
