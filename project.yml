name: MisMeeter
options:
  bundleIdPrefix: dev.mismeeter
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
schemes:
  MisMeeter:
    build:
      targets:
        MisMeeter: all
targets:
  MisMeeter:
    type: application
    platform: iOS
    sources:
      - path: MisMeeter/MisMeeterApp.swift
      - path: MisMeeter/MainView.swift
      - path: MisMeeter/MainViewModel.swift
      - path: MisMeeter/SettingsView.swift
      - path: MisMeeter/VUMeterView.swift
      - path: MisMeeter/Core/VBANHeader.swift
      - path: MisMeeter/Core/VBANSocketManager.swift
      - path: MisMeeter/Core/AudioEngineService.swift
      - path: MisMeeter/Assets.xcassets
    info:
      path: MisMeeter/Generated-Info.plist
      properties:
        CFBundleDisplayName: MisMeeter
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "5.0.0"
        CFBundleVersion: "500"
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "MisMeeter uses the microphone to transmit live VBAN audio on your local network."
        NSLocalNetworkUsageDescription: "MisMeeter sends and receives VBAN audio streams on your local network."
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mismeeter.app
        PRODUCT_NAME: MisMeeter
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon